name: Weekly Security Scan

on:
  schedule:
    # Runs every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches:
      - feature/security

jobs:
  scan-images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile-bash-curl-jq

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        id: build
        run: |
          IMAGE_NAME=$(echo "${{ matrix.dockerfile }}" | sed 's/Dockerfile-//')
          docker build -f images/${{ matrix.dockerfile }} -t ${IMAGE_NAME}:scan .
          echo "image_name=${IMAGE_NAME}:scan" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.build.outputs.image_name }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: ${{ matrix.dockerfile }}
